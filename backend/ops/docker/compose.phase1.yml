version: '3.8'

services:
  # =========================
  # Infra services
  # =========================
  postgres:
    image: postgres:16
    container_name: microshop-postgres
    environment:
      POSTGRES_USER: ms
      POSTGRES_PASSWORD: ms
      POSTGRES_DB: ms_default
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: microshop-redis
    ports:
      - "6379:6379"

  mongo-product:
    image: mongo:6
    container_name: microshop-mongo-product
    ports:
      - "27018:27017"
    volumes:
      - mongo_product_data:/data/db

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: microshop-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  # optional to debug search
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: microshop-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  # =========================
  # Spring Cloud Config Server
  # =========================
  config-server:
    build:
      context: ../../config-server
      dockerfile: Dockerfile
    container_name: microshop-config
    image: microshop-config:latest
    ports:
      - "9296:9296"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    volumes:
      - ../../config-repo:/config-repo

  # =========================
  # Eureka Discovery Server
  # =========================
  discovery-server:
    build:
      context: ../../discovery-server
      dockerfile: Dockerfile
    container_name: microshop-discovery
    image: microshop-discovery:latest
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - config-server

  # =========================
  # API Gateway
  # =========================
  api-gateway:
    build:
      context: ../../api-gateway
      dockerfile: Dockerfile
    container_name: microshop-gateway
    image: microshop-gateway:latest
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - config-server
      - discovery-server

  # =========================
  # Product Service
  # =========================
  product-service:
    build:
      context: ../../product-service
      dockerfile: Dockerfile
    container_name: microshop-product-service
    image: microshop-product-service:latest
    environment:
      - MONGO_URL=mongodb://mongo-product:27017/microshop_product
      - ES_URIS=http://microshop-elasticsearch:9200
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8600:8600"
    depends_on:
      - mongo-product
      - elasticsearch
      - discovery-server
      - config-server

volumes:
  pgdata:
  mongo_product_data:
  es_data:
