version: '3.8'
services:
  config-server:
    build: ../../config-server
    ports: ["9296:9296"]

  discovery-server:
    build: ../../discovery-server
    ports: ["8761:8761"]
    depends_on: [config-server]

  api-gateway:
    build: ../../api-gateway
    ports: ["8080:8080"]
    depends_on: [discovery-server, config-server]
  postgres-identity:
    image: postgres:16
    environment:
      POSTGRES_USER: ms
      POSTGRES_PASSWORD: ms
      POSTGRES_DB: ms_identity
    ports: [ "5434:5432" ]
  identity-service:
    build: ../../identity-service
    environment:
      - DB_URL=jdbc:postgresql://postgres-identity:5432/ms_identity
      - DB_USER=ms
      - DB_PASS=ms
    depends_on: [ postgres-identity, discovery-server, config-server ]
    ports: [ "9100:9100" ]