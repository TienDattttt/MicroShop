version: '3.8'

services:
  # =========================
  # Infra services
  # =========================
  postgres-identity:
    image: postgres:16
    environment:
      POSTGRES_USER: ms
      POSTGRES_PASSWORD: ms
      POSTGRES_DB: ms_identity
    ports: [ "5434:5432" ]

  postgres-user:
    image: postgres:16
    environment:
      POSTGRES_USER: ms
      POSTGRES_PASSWORD: ms
      POSTGRES_DB: ms_user
    ports: [ "5435:5432" ]

  redis:
    image: redis:7
    ports: [ "6379:6379" ]

  identity-service:
    build: ../../identity-service
    environment:
      - DB_URL=jdbc:postgresql://postgres-identity:5432/ms_identity
      - DB_USER=ms
      - DB_PASS=ms
    depends_on: [ postgres-identity, discovery-server, config-server ]
    ports: [ "9100:9100" ]

  user-service:
    build: ../../user-service
    environment:
      - DB_URL=jdbc:postgresql://postgres-user:5432/ms_user
      - DB_USER=ms
      - DB_PASS=ms
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports: [ "8700:8700" ]
    depends_on: [ postgres-user, redis, discovery-server, config-server, identity-service ]

  mongo-product:
    image: mongo:6
    container_name: microshop-mongo-product
    ports:
      - "27018:27017"
    volumes:
      - mongo_product_data:/data/db
    networks:
      - microshop-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 10s
      retries: 6

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: microshop-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - microshop-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 6

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: microshop-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://microshop-elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - microshop-network

  # =========================
  # Spring Cloud Config Server
  # =========================
  config-server:
    build:
      context: ../../config-server
      dockerfile: Dockerfile
    container_name: microshop-config
    image: microshop-config:latest
    ports:
      - "9296:9296"
    environment:
      - SPRING_PROFILES_ACTIVE=native
      - SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS=file:/config-repo
    volumes:
      - ../../config-repo:/config-repo
    networks:
      - microshop-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9296/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure

  # =========================
  # Eureka Discovery Server
  # =========================
  discovery-server:
    build:
      context: ../../discovery-server
      dockerfile: Dockerfile
    container_name: microshop-discovery
    image: microshop-discovery:latest
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - microshop-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure

  # =========================
  # API Gateway
  # =========================
  api-gateway:
    build:
      context: ../../api-gateway
      dockerfile: Dockerfile
    container_name: microshop-gateway
    image: microshop-gateway:latest
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - microshop-network
    restart: on-failure

  # =========================
  # Product Service
  # =========================
  product-service:
    build:
      context: ../../product-service
      dockerfile: Dockerfile
    container_name: microshop-product-service
    image: microshop-product-service:latest
    environment:
      - MONGO_URL=mongodb://mongo-product:27017/microshop_product
      - ES_URIS=http://microshop-elasticsearch:9200
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8600:8600"
    depends_on:
      elasticsearch:
        condition: service_healthy
      mongo-product:
        condition: service_started
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      identity-service:
        condition: service_started
      user-service:
        condition: service_started
    networks:
      - microshop-network
    restart: on-failure

# =========================
# Volumes & Network
# =========================
volumes:
  pgdata:
  mongo_product_data:
  es_data:

networks:
  microshop-network:
    driver: bridge
