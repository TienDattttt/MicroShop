# =====================================================================
# ? SHIPPING SERVICE CONFIGURATION
# =====================================================================

# Server configuration
server.port=8802
server.servlet.context-path=/shipping

# Spring application name
spring.application.name=shipping-service

# Database configuration (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres-shipping:5432/ms_shipping}
spring.datasource.username=${DB_USER:ms}
spring.datasource.password=${DB_PASS:ms}
spring.datasource.driver-class-name=org.postgresql.Driver

# MongoDB (Read model projection)
spring.data.mongodb.uri=${MONGO_URI:mongodb://mongo-shipping:27017/ms_shipping}

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Liquibase configuration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Kafka configuration
spring.kafka.bootstrap-servers=${KAFKA_BROKER:kafka:9092}
# Kafka producer serialization
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=shipping-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.properties.spring.json.trusted.packages=*

# External config server (optional)
spring.config.import=optional:configserver:http://config-server:9296

# Eureka configuration
eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka

# Zipkin tracing endpoint
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

# OAuth2 Resource Server (JWT)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://identity-service/identity/.well-known/jwks.json

# Axon configuration
axon.axonserver.enabled=false
axon.serializer.general=jackson
axon.serializer.events=jackson
axon.serializer.messages=jackson

# Logging configuration
logging.level.root=INFO
logging.level.com.microshop.shippingservice=DEBUG
logging.level.org.axonframework=DEBUG

# Active profile
spring.profiles.active=dev
